services:

  # ───────────────────────────────────────────────────────────────────────────
  # SERVIÇO DE REFERÊNCIA
  # ───────────────────────────────────────────────────────────────────────────
  reference:
    build: ./reference
    container_name: bbs-reference
    environment:
      - REF_REQ_PORT=5560
      - HEARTBEAT_TIMEOUT=60
    networks:
      - bbs-net

  # ───────────────────────────────────────────────────────────────────────────
  # BROKER REQ/REP
  # ───────────────────────────────────────────────────────────────────────────
  broker:
    build: ./broker
    container_name: bbs-broker
    networks:
      - bbs-net

  # ───────────────────────────────────────────────────────────────────────────
  # PROXY PUB/SUB
  # ───────────────────────────────────────────────────────────────────────────
  proxy-pubsub:
    build: ./proxy-pubsub
    container_name: bbs-proxy-pubsub
    networks:
      - bbs-net

  # ───────────────────────────────────────────────────────────────────────────
  # SERVIDORES — todos compartilham o mesmo banco e expõem porta S2S (6000)
  # S2S_PEERS lista os outros servidores para comunicação direta
  # ───────────────────────────────────────────────────────────────────────────
  server-python-1:
    build: ./server-python
    container_name: bbs-server-python-1
    environment:
      - BROKER_HOST=broker
      - BROKER_PORT=5556
      - PROXY_HOST=proxy-pubsub
      - PROXY_PORT=5557
      - PROXY_SUB_PORT=5558
      - REF_HOST=reference
      - REF_PORT=5560
      - SERVER_ID=python-server-1
      - DB_PATH=/data/bbs.db
      - S2S_PORT=6000
      - S2S_PEERS=python-server-2=bbs-server-python-2:6000,js-server-1=bbs-server-js-1:6000,js-server-2=bbs-server-js-2:6000
    volumes:
      - shared-data:/data
    depends_on:
      - reference
      - broker
      - proxy-pubsub
    networks:
      - bbs-net

  server-python-2:
    build: ./server-python
    container_name: bbs-server-python-2
    environment:
      - BROKER_HOST=broker
      - BROKER_PORT=5556
      - PROXY_HOST=proxy-pubsub
      - PROXY_PORT=5557
      - PROXY_SUB_PORT=5558
      - REF_HOST=reference
      - REF_PORT=5560
      - SERVER_ID=python-server-2
      - DB_PATH=/data/bbs.db
      - S2S_PORT=6000
      - S2S_PEERS=python-server-1=bbs-server-python-1:6000,js-server-1=bbs-server-js-1:6000,js-server-2=bbs-server-js-2:6000
    volumes:
      - shared-data:/data
    depends_on:
      - reference
      - broker
      - proxy-pubsub
    networks:
      - bbs-net

  server-js-1:
    build: ./server-js
    container_name: bbs-server-js-1
    environment:
      - BROKER_HOST=broker
      - BROKER_PORT=5556
      - PROXY_HOST=proxy-pubsub
      - PROXY_PORT=5557
      - PROXY_SUB_PORT=5558
      - REF_HOST=reference
      - REF_PORT=5560
      - SERVER_ID=js-server-1
      - DB_PATH=/data/bbs.db
      - S2S_PORT=6000
      - S2S_PEERS=python-server-1=bbs-server-python-1:6000,python-server-2=bbs-server-python-2:6000,js-server-2=bbs-server-js-2:6000
    volumes:
      - shared-data:/data
    depends_on:
      - reference
      - broker
      - proxy-pubsub
    networks:
      - bbs-net

  server-js-2:
    build: ./server-js
    container_name: bbs-server-js-2
    environment:
      - BROKER_HOST=broker
      - BROKER_PORT=5556
      - PROXY_HOST=proxy-pubsub
      - PROXY_PORT=5557
      - PROXY_SUB_PORT=5558
      - REF_HOST=reference
      - REF_PORT=5560
      - SERVER_ID=js-server-2
      - DB_PATH=/data/bbs.db
      - S2S_PORT=6000
      - S2S_PEERS=python-server-1=bbs-server-python-1:6000,python-server-2=bbs-server-python-2:6000,js-server-1=bbs-server-js-1:6000
    volumes:
      - shared-data:/data
    depends_on:
      - reference
      - broker
      - proxy-pubsub
    networks:
      - bbs-net

  # ───────────────────────────────────────────────────────────────────────────
  # CLIENTES (bots)
  # ───────────────────────────────────────────────────────────────────────────
  client-python-1:
    build: ./client-python
    container_name: bbs-client-python-1
    environment:
      - BROKER_HOST=broker
      - BROKER_PORT=5555
      - PROXY_HOST=proxy-pubsub
      - PROXY_SUB_PORT=5558
      - BOT_NAME=bot-python-1
    depends_on:
      - broker
      - proxy-pubsub
      - server-python-1
      - server-python-2
      - server-js-1
      - server-js-2
    networks:
      - bbs-net

  client-python-2:
    build: ./client-python
    container_name: bbs-client-python-2
    environment:
      - BROKER_HOST=broker
      - BROKER_PORT=5555
      - PROXY_HOST=proxy-pubsub
      - PROXY_SUB_PORT=5558
      - BOT_NAME=bot-python-2
    depends_on:
      - broker
      - proxy-pubsub
      - server-python-1
      - server-python-2
      - server-js-1
      - server-js-2
    networks:
      - bbs-net

  client-js-1:
    build: ./client-js
    container_name: bbs-client-js-1
    environment:
      - BROKER_HOST=broker
      - BROKER_PORT=5555
      - PROXY_HOST=proxy-pubsub
      - PROXY_SUB_PORT=5558
      - BOT_NAME=bot-js-1
    depends_on:
      - broker
      - proxy-pubsub
      - server-python-1
      - server-python-2
      - server-js-1
      - server-js-2
    networks:
      - bbs-net

  client-js-2:
    build: ./client-js
    container_name: bbs-client-js-2
    environment:
      - BROKER_HOST=broker
      - BROKER_PORT=5555
      - PROXY_HOST=proxy-pubsub
      - PROXY_SUB_PORT=5558
      - BOT_NAME=bot-js-2
    depends_on:
      - broker
      - proxy-pubsub
      - server-python-1
      - server-python-2
      - server-js-1
      - server-js-2
    networks:
      - bbs-net

networks:
  bbs-net:
    driver: bridge

volumes:
  shared-data:
